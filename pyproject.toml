[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "2.0.0"
description = "JARVIS — Personal AI Assistant"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "websockets>=12.0",
]
ai = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "openai>=2.32.0",
]
command = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
]
memory = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
]
client = [
    "pygame>=2.6.1",
    "pyttsx3>=2.99",
    "SpeechRecognition>=3.16.0",
    "vosk>=0.3.45",
    "piper-tts>=1.4.2",
    "audioop-lts>=0.2.2",
    "PyAudio>=0.2.14",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
# Needed because multiple services' tests/ dirs use the same basenames
# (e.g. test_config.py) with no __init__.py packages to disambiguate them.
addopts = "--import-mode=importlib"
